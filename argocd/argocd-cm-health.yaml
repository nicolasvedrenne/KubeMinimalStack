apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""

    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end

    return hs
  resource.customizations.health.postgresql.cnpg.io_Cluster: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for CloudNativePG cluster readiness"

    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "CloudNativePG cluster is ready"
              return hs
            end

            if condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "CloudNativePG cluster is not ready"
              return hs
            end
          end
        end
      end

      if obj.status.readyInstances ~= nil and obj.spec ~= nil and obj.spec.instances ~= nil then
        if obj.status.readyInstances == obj.spec.instances then
          hs.status = "Healthy"
          hs.message = "All CloudNativePG instances are ready"
          return hs
        end

        hs.message = string.format(
          "Ready instances: %s/%s",
          tostring(obj.status.readyInstances),
          tostring(obj.spec.instances)
        )
      end
    end

    return hs
